[project]
name = "uv-demo"
description = "A Python project built with UV"
license = "MIT"
readme = "README.md"
authors = [
  {name = "Willeke A'Campo", email = "willeke.acampo@miljodir.no"}
]
requires-python = ">=3.12"
dependencies = []
dynamic = ["version"]

[project.scripts]
uv-demo = "uv_demo:main"

[dependency-groups]
dev = [
  "deptry>=0.25.1",
  "ipykernel>=7.3.0,<8",
  "mypy>=2.3.1",
  "pip>=26.2.1",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.8",
  "safety>=3.8.1",
  "setuptools-scm>=10.3.4",
  "zizmor>=1.30.1",
]

[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where =["src"]
include = ["uv_demo*"]

# SETUPTOOLS-SCM config (dynamic versioning)
[tool.setuptools_scm]
write_to = "src/uv_demo/_version.py"
fallback_version = "0.0.0"

# DEPTRY config
[tool.deptry]
known_first_party = ["uv_demo"]  # ignore local package

# PYTEST config
[tool.pytest]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "ci_exclude: Tests excluded from CI/CD pipeline"
]
addopts = [
  "--cov=src",
  "--cov-report=term",
  "--cov-report=xml:coverage.xml"
]

# RUFF Rules
[tool.ruff]
exclude = [
    "dump",
    "tmp",
    "tests/conftest.py",
]

line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",    # pycodestyle: indentation errors
    "E7",    # pycodestyle: statements and control flow
    "E9",    # pycodestyle: runtime errors
    "F",     # pyflakes: code correctness
    "B",     # flake8-bugbear: likely bugs and design problems
    "ERA",   # eradicate: commented-out code
    "D",     # pydocstyle: docstring conventions
    "N"      # pep8-naming: naming conventions
]

ignore = [
    "D107",   # pydocstyle: Missing docstring in __init__
    "D213",   # pydocstyle: Multi-line summary should start at the second line
    "E501",   # pycodestyle: Line too long
    "F401",   # pyflakes: Module imported but unused
    "D417",   # pydocstyle: Missing argument descriptions in docstrings
    "ERA001",  # eradicate: Commented out code
    "D401"    # pydocstyle: First line should be in imperative mood
]

unfixable = [
    "B"   # flake8-bugbear
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["E402", "D104"]     # pycodestyle: module level import not at top of file
"tests/*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106"]  # Ignore docstring checks in tests

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# SAFETY config
[tool.safety]
full-report = true
ignore_scopes = []  # e.g. ignore "dev-dependencies"
ignore_vulnerabilities = []  # ignore specific vulnerabilities (only after review!)
output = "json"
